name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- client.js
      - run: npx playwright install --with-deps chromium
      - run: node tests/plugin-browser.mjs
      - run: node tests/hidden-preview.mjs
      - run: node tests/performance-resources.mjs
